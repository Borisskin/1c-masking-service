# Минимальная проверка службы на Linux и Windows. Выпусков здесь нет.
# Идентичность src/local_ipc с b-v8-session-manager сторожит контрольная сумма local_ipc.sha256
# (одна и та же в обоих репозиториях): правка модуля в одном месте без второго ломает проверку.
# Полное сравнение двух каталогов (diff -r) выполняется при приёмке.
name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Контрольная сумма local_ipc
        if: runner.os != 'Windows'
        run: |
          cd src/local_ipc
          test "$(cat mod.rs policy.rs tests.rs unix.rs windows.rs | sha256sum | cut -d' ' -f1)" = "$(cat ../../local_ipc.sha256)"
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo build --release --locked --bin masking-service
      - name: Артефакт (Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: masking-service-${{ runner.os }}
          path: target/release/masking-service
      - name: Артефакт (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: masking-service-${{ runner.os }}
          path: target/release/masking-service.exe
